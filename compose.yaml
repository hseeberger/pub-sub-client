services:
  pubsub:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:593.0.0-emulators@sha256:3989a42372d3b984bade6db02213d456d94a0ba3765e8b744b95c4188b6fcc89
    command:
      - gcloud
      - beta
      - emulators
      - pubsub
      - start
      - --host-port
      - 0.0.0.0:8085
    ports:
      - "8085:8085"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -o /dev/null http://127.0.0.1:8085/"]
      interval: 2s
      timeout: 2s
      retries: 5
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
