services:
  pubsub:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:594.0.0-emulators@sha256:4568487af2c00a66e1d3e0f054be208c9c5b499a3999da50428b396e1341e9fd
    command:
      - gcloud
      - beta
      - emulators
      - pubsub
      - start
      - --host-port
      - 0.0.0.0:8085
    ports:
      - "8085:8085"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -o /dev/null http://127.0.0.1:8085/"]
      interval: 2s
      timeout: 2s
      retries: 5
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
