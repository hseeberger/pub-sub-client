services:
  pubsub:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:579.0.0-emulators
    command:
      - gcloud
      - beta
      - emulators
      - pubsub
      - start
      - --host-port
      - 0.0.0.0:8085
    ports:
      - "8085:8085"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -o /dev/null http://127.0.0.1:8085/"]
      interval: 2s
      timeout: 2s
      retries: 5
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
